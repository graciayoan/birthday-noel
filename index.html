
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <title>happy birthday, love</title>
  <meta name="description" content="I love you">

  <meta property="og:type" content="website">
  <meta property="og:title" content="happy birthday, love">
  <meta property="og:description" content="I love you">
  <meta property="og:image" content="https://cdnm.heyzine.com/flip-book/cover/6e1d063a0c1.jpg">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 18px;
      background: #f5eee7;
      color: #594638;
      font-family: "Callisto MT", Georgia, serif;
    }

    .card {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 28px;
      background: #fffaf4;
      border-radius: 28px;
    }

    .cover {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
    }

    .text {
      margin-top: 38px;
      text-align: left;
      font-family: "Callisto MT", Georgia, serif;
      font-weight: normal;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(28px, 5vw, 48px);
      line-height: 1.25;
      font-weight: normal;
    }

    p {
      margin: 0;
      font-size: clamp(22px, 3.5vw, 32px);
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <main class="card">
    <img
      class="cover"
      src="https://cdnm.heyzine.com/flip-book/cover/6e1d063a0c1.jpg"
      alt="Birthday cover"
    >

    <div class="text">
      <h1>happy birthday, love</h1>
      <p>I love you</p>
    </div>
  </main>
</body>
</html>
