
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>happy birthday, love</title>
  <meta name="description" content="I love you">

  <meta property="og:type" content="website">
  <meta property="og:title" content="happy birthday, love">
  <meta property="og:description" content="I love you">
  <meta property="og:image" content="https://cdnm.heyzine.com/flip-book/cover/6e1d063a0c1.jpg">
  <meta property="og:url" content="https://graciayoan.github.io/birthday-noel/">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      background: #f5eee7;
      color: #594638;
      font-family: "Callisto MT", Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 100%;
      max-width: 440px;
      margin: auto;
      padding: 24px;
      background: #fffaf4;
      border-radius: 28px;
    }

    .cover-link {
      display: block;
      width: 100%;
      max-width: 260px;
      margin: 0 auto;
      cursor: pointer;
    }

    .cover {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
      cursor: pointer;
    }

    .text {
      margin-top: 26px;
      text-align: left;
      font-family: "Callisto MT", Georgia, serif;
      font-weight: normal;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      line-height: 1.3;
      font-weight: normal;
    }

    p {
      margin: 0;
      font-size: 22px;
      line-height: 1.4;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 14px;
      }

      .card {
        padding: 18px;
      }

      .cover-link {
        max-width: 240px;
      }

      h1 {
        font-size: 27px;
      }

      p {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <a
      class="cover-link"
      href="https://heyzine.com/flip-book/6e1d063a0c.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open birthday flipbook"
    >
      <img
        class="cover"
        src="https://cdnm.heyzine.com/flip-book/cover/6e1d063a0c1.jpg"
        alt="Birthday cover"
      >
    </a>

    <div class="text">
      <h1>happy birthday, love</h1>
      <p>I love you</p>
    </div>
  </main>
</body>
</html>
