
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>happy birthday, love</title>
  <meta name="description" content="I love you">

  <meta property="og:type" content="website">
  <meta property="og:title" content="happy birthday, love">
  <meta property="og:description" content="I love you">
  <meta property="og:image" content="https://cdnm.heyzine.com/flip-book/cover/6e1d063a0c1.jpg">
  <meta property="og:url" content="https://graciayoan.github.io/birthday-noel/">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #f5eee7;
      color: #594638;
      font-family: "Callisto MT", Georgia, serif;
    }

    .card {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: 18px;
      background: #fffaf4;
      border-radius: 24px;
    }

    .cover {
      display: block;
      width: 100%;
      max-width: 280px;
      height: auto;
      margin: 0 auto;
      border-radius: 10px;
    }

    .text {
      margin-top: 26px;
      text-align: left;
      font-family: "Callisto MT", Georgia, serif;
      font-weight: normal;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      line-height: 1.3;
      font-weight: normal;
    }

    p {
      margin: 0;
      font-size: 22px;
      line-height: 1.4;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }

      .card {
        padding: 14px;
      }

      .cover {
        max-width: 240px;
      }

      h1 {
        font-size: 27px;
      }

      p {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <img
      class="cover"
      src="https://cdnm.heyzine.com/flip-book/cover/6e1d063a0c1.jpg"
      alt="Birthday cover"
    >

    <div class="text">
      <h1>happy birthday, love</h1>
      <p>I love you</p>
    </div>
  </main>
</body>
</html>
